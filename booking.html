<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="booking.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <section id="header">
        <div class="logo">
            <img src="https://t3.ftcdn.net/jpg/03/24/30/24/360_F_324302474_PPtpdsBgyhJjxCaWXDwrOzdlYRlPmIh2.jpg"
                alt="cinema logo" width="100">
            <p>lights, camera, action!</p>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="my bookings.html">My Bookings</a>
        </div>
    </section>
    <h1>TICKET BOOKING</h1>

    <section class="booking-panel">
        <h2>Book Your Movie Tickets</h2>
        <form class="booking-form">
            <label>
                Movie title
                <input type="text" name="movie" placeholder="Enter movie title" required />
            </label>
            <label>
                Customer name
                <input type="text" name="customer" placeholder="Enter customer name" required />
            </label>
            <label>
                Showtime date
                <input type="date" name="showtime" required />
            </label>
            <label>
                Seat numbers
                <input type="text" name="seats" placeholder="e.g. A1, A2" required />
            </label>
            <label>
                Theater
                <select name="theater" required>
                    <option value="">Select theater</option>
                    <option value="Westgate">Westgate</option>
                    <option value="Two Rivers">Two Rivers</option>
                    <option value="Garden City">Garden City</option>
                    <option value="Junction">Junction</option>
                    <option value="Sarit">Sarit</option>
                </select>
            </label>
            <label>
                Seat count
                <input type="number" name="seatCount" min="1" max="10" value="1" required />
            </label>
            <label>
                Ticket price
                <input type="text" name="price" placeholder="ksh 0" required />
            </label>
            <button type="submit">Confirm Booking</button>
            <button type="button" id="clearBookings">Clear Form</button>
        </form>
    </section>

    <section id="footer">

        <h3>Follow Us</h3>
        <a href="#" class="btn">Back to Top</a>
        <div class="social-media">
            <a href="https://www.facebook.com/cinemabooking" target="_blank"><i class="fa-brands fa-square-facebook"
                    style="color: rgb(255, 18, 0);"></i></a>
            <a href="https://www.twitter.com/cinemabooking" target="_blank"><i class="fa-brands fa-square-x-twitter"
                    style="color: rgb(255, 18, 0);"></i></a>
            <a href="https://www.instagram.com/cinemabooking" target="_blank"><i class="fa-brands fa-square-instagram"
                    style="color: rgb(255, 18, 0);"></i></a>
            <a href="https://www.youtube.com/cinemabooking" target="_blank"><i class="fa-brands fa-square-youtube"
                    style="color: rgb(255, 18, 0);"></i></a>

        </div>
        <hr>
        <p class="small-text">&copy; 2026 Cinema Booking Website. All rights reserved.</p>

    </section>

    <script src="storage.js"></script>
    <script src="booking.js"></script>

</body>

</html>
